name: Build APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip FFSmoothTouchProject.zip -d extracted
          find extracted -name settings.gradle -print

      - name: Locate project
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FF-Smooth-Touch-POVA5-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
